<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>苹果游戏排行榜</title>
    <link rel="icon" type="image/png" href="ODF.png">
    <style>
        :root {
            --bg: #f5f5f7;
            --card-bg: #fff;
            --text: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --border: #d2d2d7;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --header-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ===== 全宽贴顶标题栏 ===== */
        .sticky-header {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: saturate(180%) blur(12px);
            -webkit-backdrop-filter: saturate(180%) blur(12px);
            box-shadow: var(--header-shadow);
            padding: 0.9rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .sticky-header .header-inner {
            max-width: 860px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .sticky-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
            line-height: 1.2;
        }

        .sticky-header .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.4;
        }

        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.6rem 1rem;
            align-items: center;
            width: 100%;
            padding-top: 0.2rem;
        }

        .control-group {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border-radius: 10px;
            padding: 0.3rem 0.9rem;
            box-shadow: var(--shadow);
            font-size: 0.9rem;
        }

        .control-group label {
            font-weight: 600;
            margin-right: 0.4rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .control-group select {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.25rem 0.6rem;
            font-size: 0.85rem;
            font-family: inherit;
            background: #fff;
            color: var(--text);
            outline: none;
            cursor: pointer;
        }

        .control-group select:focus {
            border-color: var(--accent);
        }

        .check-box {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border-radius: 10px;
            padding: 0.3rem 1rem;
            box-shadow: var(--shadow);
            gap: 0.4rem;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        .check-box input {
            width: 17px;
            height: 17px;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* ===== 容器 ===== */
        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 1.2rem 1rem 2rem;
        }

        /* ===== 状态 & 列表 ===== */
        .status {
            text-align: center;
            padding: 1.2rem 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .rank-list {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .rank-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--card-bg);
            border-radius: 14px;
            padding: 0.7rem 1.1rem;
            box-shadow: var(--shadow);
            text-decoration: none;
            color: inherit;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .rank-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.10);
        }

        .rank-number {
            font-size: 1.4rem;
            font-weight: 700;
            min-width: 2rem;
            text-align: center;
            flex-shrink: 0;
            color: var(--text-secondary);
        }

        .rank-number.top3 {
            color: var(--accent);
        }

        .app-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: #f0f0f0;
            flex-shrink: 0;
            object-fit: cover;
        }

        .app-info {
            flex: 1;
            min-width: 0;
        }

        .app-name {
            font-weight: 600;
            font-size: 1.05rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-developer {
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-price {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--accent);
            min-width: 3.6rem;
            text-align: right;
            flex-shrink: 0;
        }

        .app-price.free {
            color: #34c759;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .sticky-header {
                padding: 0.6rem 0.8rem;
                gap: 0.3rem;
            }

            .sticky-header h1 {
                font-size: 1.4rem;
            }

            .sticky-header .subtitle {
                font-size: 0.8rem;
            }

            .controls {
                gap: 0.4rem 0.6rem;
            }

            .control-group {
                padding: 0.2rem 0.6rem;
                font-size: 0.8rem;
            }

            .control-group select {
                font-size: 0.78rem;
                padding: 0.15rem 0.4rem;
            }

            .check-box {
                padding: 0.2rem 0.7rem;
                font-size: 0.78rem;
            }

            .check-box input {
                width: 15px;
                height: 15px;
            }

            .rank-item {
                padding: 0.5rem 0.8rem;
                gap: 0.6rem;
                border-radius: 12px;
            }

            .rank-number {
                font-size: 1.1rem;
                min-width: 1.6rem;
            }

            .app-icon {
                width: 44px;
                height: 44px;
                border-radius: 11px;
            }

            .app-name {
                font-size: 0.9rem;
            }

            .app-developer {
                font-size: 0.75rem;
            }

            .app-price {
                font-size: 0.85rem;
                min-width: 3rem;
            }

            .container {
                padding: 0.8rem 0.6rem 1.5rem;
            }

            .status {
                padding: 0.8rem 0;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            .sticky-header h1 {
                font-size: 1.2rem;
            }

            .control-group {
                padding: 0.15rem 0.5rem;
                font-size: 0.7rem;
            }

            .control-group select {
                font-size: 0.7rem;
                padding: 0.1rem 0.3rem;
            }

            .check-box {
                padding: 0.15rem 0.5rem;
                font-size: 0.7rem;
            }

            .check-box input {
                width: 14px;
                height: 14px;
            }

            .rank-number {
                font-size: 0.95rem;
                min-width: 1.4rem;
            }

            .app-icon {
                width: 38px;
                height: 38px;
                border-radius: 10px;
            }

            .app-name {
                font-size: 0.8rem;
            }

            .app-developer {
                font-size: 0.7rem;
            }

            .app-price {
                font-size: 0.75rem;
                min-width: 2.6rem;
            }
        }
    </style>
</head>

        // ===== 工具函数 =====
        function buildURL(country, chartType, genre, limit) {
            limit = limit || 100;
            const path = chartType === 'topgrossing' ? 'topgrossingapplications' : 'toppaidapplications';
            return `https://itunes.apple.com/${country}/rss/${path}/limit=${limit}/genre=${genre}/json`;
        }

        async function fetchGenre(url) {
            try {
                const resp = await fetch(url);
                if (!resp.ok) return [];
                const data = await resp.json();
                return data.feed?.entry || [];
            } catch {
                return [];
            }
        }

        function getAppId(entry) {
            return entry['id']?.attributes?.['im:id'] || '';
        }

        function getAppName(entry) {
            return entry['im:name']?.label || '';
        }

        function extractAppInfo(entry) {
            const name = getAppName(entry);
            const developer = entry['im:artist']?.label || '';
            const appId = getAppId(entry);
            const images = entry['im:image'];
            const icon = images?.length >= 3 ? images[2].label : (images?.[0]?.label || '');
            const priceLabel = entry['im:price']?.label || '';
            const priceAmount = entry['im:price']?.attributes?.amount || '0';
            let displayPrice = priceLabel;
            if (priceAmount === '0.00' || priceLabel === '获取') displayPrice = '免费';
            return { name, developer, appId, icon, displayPrice };
        }

        function isAnimeGameByName(name) {
            const lowerName = name.toLowerCase();
            return KEYWORDS.some(kw => lowerName.includes(kw.toLowerCase()));
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== 渲染 =====

            rankContainer.innerHTML = '';
            if (entries.length === 0) {
                rankContainer.innerHTML = '<div class="status">没有符合条件的结果</div>';
                return;
            }
            entries.forEach((entry, index) => {
                const info = extractAppInfo(entry);
                const rank = index + 1;
                const rankClass = rank <= 3 ? 'rank-number top3' : 'rank-number';

                const card = document.createElement('a');
                card.className = 'rank-item';
                card.href = info.appId ? `https://apps.apple.com/cn/app/id${info.appId}` : '#';
                card.target = '_blank';
                card.innerHTML = `
                        <div class="${rankClass}">${rank}</div>
                        <img class="app-icon" src="${info.icon}" alt="" loading="lazy"
                             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2256%22 height=%2256%22><rect fill=%22%23e0e0e0%22 width=%2256%22 height=%2256%22 rx=%2214%22/></svg>'">
                        <div class="app-info">
                            <div class="app-name">${escapeHtml(info.name)}</div>
                            <div class="app-developer">${escapeHtml(info.developer)}</div>
                        </div>
                        <div class="app-price ${info.displayPrice === '免费' ? 'free' : ''}">${escapeHtml(info.displayPrice)}</div>
                    `;
                rankContainer.appendChild(card);
            });
        }

        function applyFilterAndRender() {
            let display = allEntries;
            if (animeCheckbox.checked) {
                display = allEntries.filter(entry => isAnimeGameByName(getAppName(entry)));
            }
            statusDiv.textContent = `共 ${display.length} 款游戏`;
            renderList(display);
        }

        // ===== 数据加载 =====
        async function loadAllData() {
            const country = countrySelect.value;
            const chart = chartSelect.value;

            statusDiv.textContent = '正在加载...';
            rankContainer.innerHTML = '';

            const url = buildURL(country, chart, TOTAL_GENRE, 100);
            allEntries = await fetchGenre(url);

            statusDiv.textContent = '';
            applyFilterAndRender();
        }

        // ===== 事件绑定 =====
        countrySelect.addEventListener('change', loadAllData);
        chartSelect.addEventListener('change', loadAllData);
        animeCheckbox.addEventListener('change', applyFilterAndRender);

        // ===== 启动 =====
        loadAllData();
    </script>

</body>
</html>
